<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Oriel: a bay window projecting from a wall, lit from within. -->
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f0a33c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b25e"/>
      <stop offset="1" stop-color="#c97f2a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#161b22"/>
  <!-- the cap above the window -->
  <polygon points="20,38 42,26 86,26 108,38" fill="#8b949e"/>
  <!-- side panes, then the front pane -->
  <polygon points="26,42 44,34 44,92 26,84" fill="url(#side)"/>
  <polygon points="102,42 84,34 84,92 102,84" fill="url(#side)"/>
  <rect x="44" y="34" width="40" height="58" fill="url(#front)"/>
  <!-- mullions and the transom -->
  <g stroke="#161b22" stroke-width="3" stroke-linecap="square" fill="none">
    <line x1="64" y1="34" x2="64" y2="92"/>
    <line x1="44" y1="34" x2="44" y2="92"/>
    <line x1="84" y1="34" x2="84" y2="92"/>
    <polyline points="26,58 44,54 84,54 102,58"/>
  </g>
  <!-- the corbel below -->
  <polygon points="26,86 44,94 84,94 102,86 90,104 38,104" fill="#6e7681"/>
</svg>
